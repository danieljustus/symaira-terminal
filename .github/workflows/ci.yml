name: CI

# retrigger clean Mini run

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '41 5 * * 1'  # weekly Monday 05:41 UTC — full suite incl. macOS builds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: [self-hosted, macOS, X64, mac-mini]  # Mac Mini runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Build & Test (SymairaKit)
    if: github.event_name != 'pull_request'  # PR gate = lint only; full build+test on main/schedule
    runs-on: [self-hosted, macOS, X64, mac-mini]  # Mac Mini runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build
        working-directory: Packages/SymairaKit
        run: swift build
      - name: Test
        working-directory: Packages/SymairaKit
        run: swift test

  app:
    name: Build App (boundary check)
    if: github.event_name != 'pull_request'  # PR gate = lint only; app build on main/schedule
    runs-on: [self-hosted, macOS, X64, mac-mini]  # Mac Mini runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # The public repo must build with zero private/cloud dependencies —
      # this job IS the commercial-boundary check.
      - name: Build app (unsigned)
        run: |
          xcodebuild -project SymairaTerminal.xcodeproj \
            -scheme SymairaTerminal -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
