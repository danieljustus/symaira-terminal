name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '41 5 * * 1'  # weekly Monday 05:41 UTC — full suite incl. macOS builds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # /opt/homebrew = Apple Silicon (macbook runner), /usr/local = Intel (mac-mini runner)
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: [self-hosted, macOS, X64, mac-mini]  # Mac Mini runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Build & Test (SymairaKit)
    if: github.event_name != 'pull_request'  # PR gate = lint only; full build+test on main/schedule
    runs-on: [self-hosted, macOS, X64, mac-mini]  # Mac Mini runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        # sudo needs a password on the macbook runner -> fall back to DEVELOPER_DIR,
        # which xcodebuild/swift respect without root. Works on both runners.
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then XCODE=/Applications/Xcode_16.4.app; else XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          sudo -n xcode-select -s "$XCODE" 2>/dev/null || true
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version
      - name: Build
        working-directory: Packages/SymairaKit
        run: swift build -j 2
      - name: Test
        working-directory: Packages/SymairaKit
        run: swift test -j 2

  app:
    name: Build App (boundary check)
    if: github.event_name != 'pull_request'  # PR gate = lint only; app build on main/schedule
    runs-on: [self-hosted, macOS, X64, mac-mini]  # Mac Mini runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        # sudo needs a password on the macbook runner -> fall back to DEVELOPER_DIR,
        # which xcodebuild/swift respect without root. Works on both runners.
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then XCODE=/Applications/Xcode_16.4.app; else XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          sudo -n xcode-select -s "$XCODE" 2>/dev/null || true
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # The public repo must build with zero private/cloud dependencies —
      # this job IS the commercial-boundary check.
      - name: Build app (unsigned)
        run: |
          xcodebuild -project SymairaTerminal.xcodeproj \
            -scheme SymairaTerminal -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
