name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '41 5 * * 1'  # weekly Monday 05:41 UTC — full suite incl. macOS builds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # /opt/homebrew = Apple Silicon (MacBook runner), /usr/local = legacy Intel path
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: [self-hosted, macOS, ARM64, macbook-terminal]  # lint-only PR gate; Xcode jobs use the ARM64 runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # clean=false: skip Post-Run git cleanup (hangs on self-hosted macOS runners)
          clean: false
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Build & Test (SymairaKit)
    if: github.event_name != 'pull_request'  # PR gate = lint only; full build+test on main/schedule
    runs-on: [self-hosted, macOS, ARM64, macbook-terminal]  # Xcode 27 MacBook runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # clean=false: skip Post-Run git cleanup (hangs on self-hosted macOS runners)
          clean: false
      - name: Select Xcode 27
        # DEVELOPER_DIR points the full Xcode toolchain at the runner without requiring sudo.
        run: |
          if [ -d /Applications/Xcode-beta.app/Contents/Developer ]; then
            XCODE=/Applications/Xcode-beta.app
          else
            XCODE="$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          test -d "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version | grep -F 'Xcode 27.0'
      - name: Build
        working-directory: Packages/SymairaKit
        # Scale parallelism by RAM: Mini (8GB) needs -j2, MacBook (24GB) can do more
        run: |
          MEM_GB=$(($(sysctl -n hw.memsize) / 1073741824))
          if [ "$MEM_GB" -le 8 ]; then JOBS=2; elif [ "$MEM_GB" -le 16 ]; then JOBS=4; else JOBS=6; fi
          swift build -j "$JOBS"
      - name: Test
        working-directory: Packages/SymairaKit
        run: |
          MEM_GB=$(($(sysctl -n hw.memsize) / 1073741824))
          if [ "$MEM_GB" -le 8 ]; then JOBS=2; elif [ "$MEM_GB" -le 16 ]; then JOBS=4; else JOBS=6; fi
          swift test -j "$JOBS"

  app:
    name: Build App (boundary check)
    if: github.event_name != 'pull_request'  # PR gate = lint only; app build on main/schedule
    runs-on: [self-hosted, macOS, ARM64, macbook-terminal]  # Xcode 27 MacBook runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # clean=false: skip Post-Run git cleanup (hangs on self-hosted macOS runners)
          clean: false
      - name: Select Xcode 27
        # DEVELOPER_DIR points the full Xcode toolchain at the runner without requiring sudo.
        run: |
          if [ -d /Applications/Xcode-beta.app/Contents/Developer ]; then
            XCODE=/Applications/Xcode-beta.app
          else
            XCODE="$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          test -d "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version | grep -F 'Xcode 27.0'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # The public repo must build with zero private/cloud dependencies —
      # this job IS the commercial-boundary check.
      - name: Build app (unsigned)
        run: |
          xcodebuild -project SymairaTerminal.xcodeproj \
            -scheme SymairaTerminal -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
